[project]
name = "lastfm-to-sqlite"
version = "0.3.0"
description = "Export Last.fm listening history to SQLite"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "hp0404" }]
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.2",
    "requests>=2.34.2",
    "sqlite-utils>=4.1.1",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/hp0404/lastfm-to-sqlite"
Issues = "https://github.com/hp0404/lastfm-to-sqlite/issues"
Changelog = "https://github.com/hp0404/lastfm-to-sqlite/releases"

[project.scripts]
lastfm = "lastfm.cli:cli"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "types-requests>=2.33.0.20260712",
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lastfm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "sqlite_utils.*"
ignore_missing_imports = true
